# Models for the real-model pilot.
#
# Picked on 2026-10-25 from OpenRouter's public models endpoint
# (https://openrouter.ai/api/v1/models, no key needed). Prices are USD per million tokens as
# listed that day; re-check them before a paid run. Each model is the mid tier of its family:
# capable, but below that family's most expensive frontier model.
#
# Roles are not set here. The harness derives them from the prices below:
#   cheap = cheapest model (first answerer in the cascades)
#   judge = second-cheapest model (judge method, fusion synthesizer, LLM gate)

fetched: "2026-10-25"
base_url: https://openrouter.ai/api/v1
temperature: 0.0
# Three of the four models reason on every call and reasoning tokens count against
# max_tokens, so 1024 risks empty answers. 4096 leaves room for low-effort reasoning.
max_tokens: 4096

models:
  - id: deepseek/deepseek-v4-pro
    label: deepseek-v4-pro
    family: DeepSeek (open weights, deepseek-ai/DeepSeek-V4-Pro)
    prompt_usd_per_mtok: 0.2088
    completion_usd_per_mtok: 0.4176
    supports_temperature: true
    # Supported efforts are xhigh, high and none; none keeps the cheap first answer fast.
    reasoning: {effort: none}
    why: >-
      Strongest open-weight model on OpenRouter at a mid-tier price; 1M context fits the
      long CloningScenarios sequences.

  - id: google/gemini-3.8-flash
    label: gemini-3.8-flash
    family: Google
    prompt_usd_per_mtok: 0.825
    completion_usd_per_mtok: 4.125
    supports_temperature: true
    # Reasoning is mandatory for this model; low is its smallest effort.
    reasoning: {effort: low}
    why: >-
      Google's newest Flash model. Gemini 4 Argon is the flagship ($2/$10) and was excluded
      as frontier tier.

  - id: anthropic/claude-sonnet-5.5
    label: claude-sonnet-5.5
    family: Anthropic
    prompt_usd_per_mtok: 2.0
    completion_usd_per_mtok: 10.0
    # Not in the model's supported_parameters; OpenRouter drops temperature for it.
    supports_temperature: false
    reasoning: {effort: low}
    why: >-
      Anthropic's Sonnet tier, below Opus 5.5 and Fable 5.1. Haiku 5.5 was excluded as the
      small tier.

  - id: openai/gpt-6.1-sol
    label: gpt-6.1-sol
    family: OpenAI
    prompt_usd_per_mtok: 2.0
    completion_usd_per_mtok: 10.0
    # Not in the model's supported_parameters; OpenRouter drops temperature for it.
    supports_temperature: false
    reasoning: {effort: low}
    why: >-
      Positioned below the flagship GPT-6 Astra ($10/$50). GPT-6 Luna was excluded as the
      small tier.

jev:
  decisions_url: https://openrouter.ai/api/alpha/decisions
  model: typesafe/jev-1.14
  fallback_model: typesafe/jev-1.13
  # Output tokens are free; billed on input only.
  input_usd_per_mtok: 0.042
