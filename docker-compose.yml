# ART Framework Docker Compose

version: '3.8'

services:
  art-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: art-framework-api
    ports:
      - "8000:8000"
    environment:
      - ART_HOST=0.0.0.0
      - ART_PORT=8000
      - ART_DEBUG=false
      - ART_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/art_framework
      - ART_REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - art-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: art-framework-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=art_framework
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - art-network

  redis:
    image: redis:7-alpine
    container_name: art-framework-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - art-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: art-framework-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@art-framework.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - art-network

volumes:
  postgres_data:

networks:
  art-network:
    driver: bridge
